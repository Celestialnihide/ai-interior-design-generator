[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-interior-design-generator"
version = "0.6.2"
description = "Plugin-host AI interior design generator for Windows desktops."
readme = "CONTRIBUTING.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "AIDG Contributors" }]
keywords = ["interior-design", "ai", "generative", "desktop", "plugin-host", "onnx"]

dependencies = [
    "PySide6>=6.7,<6.9",
    "onnxruntime>=1.18,<2.0",
    "numpy>=1.26,<3.0",
    "Pillow>=10.3",
    "pydantic>=2.7,<3.0",
    "tomli-w>=1.0",
    "structlog>=24.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
gpu = ["onnxruntime-directml>=1.18; sys_platform == 'win32'"]
dev = [
    "pytest>=8.2",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-Pillow",
]

[project.scripts]
aidg = "ai_interior_design_generator.__main__:main"

[project.entry-points."ai_interior_design_generator.plugins"]
scandinavian = "plugins.scandinavian:ScandinavianPlugin"
japandi = "plugins.japandi:JapandiPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_interior_design_generator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_interior_design_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"